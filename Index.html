<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>دعوة زفاف مهدي وضحى</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #fcf8f2;
            color: #333;
            text-align: center;
            margin: 0;
            padding: 0;
        }
        .screen {
            min-height: 100vh;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            padding: 20px;
            box-sizing: border-box;
        }
        .white-bg {
            background-color: #ffffff;
            border-top: 2px solid #e2d1a3;
        }
        h1 {
            color: #b8860b;
            font-size: 32px;
            margin: 15px 0;
        }
        h2 {
            color: #b8860b;
            font-size: 26px;
            margin-bottom: 20px;
        }
        p {
            font-size: 18px;
            line-height: 1.8;
            margin: 8px 0;
        }
        .ring-btn {
            font-size: 70px;
            cursor: pointer;
            margin: 20px 0;
            border: none;
            background: none;
            outline: none;
        }
        .map-btn {
            display: inline-block;
            margin-top: 25px;
            padding: 12px 25px;
            background-color: #b8860b;
            color: #fff;
            text-decoration: none;
            border-radius: 25px;
            font-size: 18px;
            font-weight: bold;
        }
    </style>
</head>
<body>

    <div class="screen">
        <p>يتشرفان بدعوتكم لحضور حفل زفافهما</p>
        <h1>مهدي كريم & ضحى معد</h1>
        <p>اضغط على صندوق الحلقة لتفاصيل الحفل</p>
        
        <button class="ring-btn" onclick="openDetails()">💍</button>
    </div>

    <div id="details" class="screen white-bg">
        <h2>تفاصيل الحفل</h2>
        <p><strong>التاريخ:</strong> 1 / 1 / 2027</p>
        <p><strong>الوقت:</strong> الساعة 4:00 عصراً</p>
        <p><strong>المكان:</strong> قاعة زيونة للأعراس والمناسبات</p>
        
        <a class="map-btn" href="https://maps.google.com/?cid=15106335666789968361&entry=gps&g_st=ac" target="_blank">📍 موقع الحفل على الخريطة</a>
    </div>

    <script>
        function openDetails() {
            document.getElementById('details').scrollIntoView({ behavior: 'smooth' });
        }
    </script>

</body>
</html>
